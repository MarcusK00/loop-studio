<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 100vw; height: 100vh;
      background:
        radial-gradient(540px 260px at 22% 24%, color-mix(in srgb, var(--loop-spark) 13%, transparent), transparent 72%),
        radial-gradient(520px 260px at 78% 76%, color-mix(in srgb, var(--loop-accent) 11%, transparent), transparent 72%),
        var(--loop-ground);
      color: var(--loop-body);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 20px 28px; overflow: hidden;
    }
    .topbar { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; }
    .phase-ring { width: 16px; height: 16px; flex: none; }
    .stages { display: flex; gap: 8px; }
    .pill {
      font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; font-weight: 600;
      padding: 4px 11px; border-radius: 999px; border: 1px solid var(--loop-line);
      background: var(--loop-surface); color: var(--loop-body); opacity: 0.72;
    }
    .pill.active { opacity: 1; border-color: var(--loop-accent); background: var(--loop-accent); color: var(--loop-on-accent); }
    .canvas-card {
      width: 100%; flex: 1; margin: 12px 0;
      background: var(--loop-surface); border: 1px solid var(--loop-line); border-radius: 14px;
      box-shadow: 0 18px 46px rgba(0, 0, 0, 0.22);
      position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    svg.mesh { width: 100%; height: 100%; display: block; }
    .caption-pill {
      display: flex; align-items: center; gap: 10px; background: var(--loop-surface);
      border: 1px solid var(--loop-line); border-radius: 10px; padding: 7px 18px;
    }
    .caption-text { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13.5px; font-weight: 600; color: var(--loop-body); }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg class="phase-ring" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" fill="none" stroke="var(--loop-line)" stroke-width="2.2" />
        <circle id="ring-dot" cx="10" cy="3" r="2.8" fill="var(--loop-accent)" />
      </svg>
      <span>Loop Studio Pipeline Architecture</span>
    </div>
    <div class="stages">
      <span class="pill" id="st-0" data-loop-stage>Source</span>
      <span class="pill" id="st-1" data-loop-stage>Browser</span>
      <span class="pill" id="st-2" data-loop-stage>Audit</span>
      <span class="pill" id="st-3" data-loop-stage>Bundle</span>
    </div>
  </div>

  <div class="canvas-card">
    <svg class="mesh" viewBox="0 0 744 256" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="12" r="1" fill="var(--loop-line)" opacity="0.55" />
        </pattern>
        <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--loop-accent)" />
          <stop offset="100%" stop-color="var(--loop-spark)" />
        </linearGradient>
      </defs>

      <rect width="744" height="256" fill="url(#dots)" />

      <!-- Wire connections -->
      <path id="p0" d="M 162 128 C 192 128, 194 128, 224 128" fill="none" stroke="var(--loop-line)" stroke-width="2.4" />
      <path id="p1" d="M 366 128 C 402 128, 404 72, 438 72" fill="none" stroke="var(--loop-line)" stroke-width="2.4" />
      <path id="p2" d="M 366 128 C 402 128, 404 184, 438 184" fill="none" stroke="var(--loop-line)" stroke-width="2.4" />
      <path id="p3" d="M 578 72 C 604 72, 604 128, 622 128" fill="none" stroke="var(--loop-line)" stroke-width="2.4" />
      <path id="p4" d="M 578 184 C 604 184, 604 128, 622 128" fill="none" stroke="var(--loop-line)" stroke-width="2.4" />

      <!-- Active glowing wires -->
      <path id="g0" d="M 162 128 C 192 128, 194 128, 224 128" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.3" />
      <path id="g1" d="M 366 128 C 402 128, 404 72, 438 72" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.3" />
      <path id="g2" d="M 366 128 C 402 128, 404 184, 438 184" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.3" />
      <path id="g3" d="M 578 72 C 604 72, 604 128, 622 128" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.3" />
      <path id="g4" d="M 578 184 C 604 184, 604 128, 622 128" fill="none" stroke="url(#edgeGrad)" stroke-width="3" opacity="0.3" />

      <!-- Node 1: Source -->
      <g id="node-0">
        <rect x="22" y="84" width="140" height="88" rx="12" fill="var(--loop-ground)" stroke="var(--loop-line)" stroke-width="1.8" />
        <text x="38" y="109" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">01 · INPUT</text>
        <text x="38" y="131" fill="var(--loop-body)" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700">scene.html</text>
        <text x="38" y="152" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="11">git diff / GLSL</text>
      </g>

      <!-- Node 2: Browser Harness -->
      <g id="node-1">
        <rect x="224" y="84" width="142" height="88" rx="12" fill="var(--loop-ground)" stroke="var(--loop-line)" stroke-width="1.8" />
        <text x="240" y="109" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">02 · HARNESS</text>
        <text x="240" y="131" fill="var(--loop-body)" font-family="-apple-system, Inter, sans-serif" font-size="14" font-weight="700">WebKit / Chrome</text>
        <text x="240" y="152" fill="var(--loop-spark)" font-family="ui-monospace, Menlo, monospace" font-size="11" id="phase-lbl">phase ∈ [0, 1)</text>
      </g>

      <!-- Node 3a: Seam & WCAG Audit -->
      <g id="node-2a">
        <rect x="438" y="30" width="140" height="84" rx="12" fill="var(--loop-ground)" stroke="var(--loop-line)" stroke-width="1.8" />
        <text x="454" y="54" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">03A · VERIFY</text>
        <text x="454" y="76" fill="var(--loop-body)" font-family="-apple-system, Inter, sans-serif" font-size="13.5" font-weight="700">Seam + WCAG</text>
        <text x="454" y="96" fill="var(--loop-spark)" font-family="ui-monospace, Menlo, monospace" font-size="11">4.5:1 dark/light</text>
      </g>

      <!-- Node 3b: Source Drift + Cold Read -->
      <g id="node-2b">
        <rect x="438" y="142" width="140" height="84" rx="12" fill="var(--loop-ground)" stroke="var(--loop-line)" stroke-width="1.8" />
        <text x="454" y="166" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="10.5" font-weight="700">03B · GROUND</text>
        <text x="454" y="188" fill="var(--loop-body)" font-family="-apple-system, Inter, sans-serif" font-size="13.5" font-weight="700">file:line + Read</text>
        <text x="454" y="208" fill="var(--loop-accent)" font-family="ui-monospace, Menlo, monospace" font-size="11">zero drift</text>
      </g>

      <!-- Node 4: Dark/Light Output Bundle -->
      <g id="node-3">
        <rect x="622" y="84" width="102" height="88" rx="12" fill="var(--loop-ground)" stroke="var(--loop-line)" stroke-width="1.8" />
        <text x="634" y="109" fill="var(--loop-muted)" font-family="ui-monospace, Menlo, monospace" font-size="10" font-weight="700">04 · OUT</text>
        <text x="634" y="131" fill="var(--loop-body)" font-family="-apple-system, Inter, sans-serif" font-size="13.5" font-weight="700">&lt;picture&gt;</text>
        <text x="634" y="152" fill="var(--loop-spark)" font-family="ui-monospace, Menlo, monospace" font-size="10.5">WebP · MP4</text>
      </g>

      <!-- Traveling signal packets -->
      <circle id="pkt0" r="5" fill="var(--loop-accent)" stroke="var(--loop-ground)" stroke-width="1.8" />
      <circle id="pkt1" r="5" fill="var(--loop-spark)" stroke="var(--loop-ground)" stroke-width="1.8" />
      <circle id="pkt2" r="5" fill="var(--loop-accent)" stroke="var(--loop-ground)" stroke-width="1.8" />
      <circle id="pkt3" r="5" fill="var(--loop-spark)" stroke="var(--loop-ground)" stroke-width="1.8" />
      <circle id="pkt4" r="5" fill="var(--loop-accent)" stroke="var(--loop-ground)" stroke-width="1.8" />
    </svg>
  </div>

  <div class="caption-pill">
    <span class="caption-text" id="caption-text" data-loop-caption>ingests HTML, git diff, or GLSL source</span>
  </div>

  <script>
    function placeOnPath(pathId, pktId, rawU) {
      const u = ((rawU % 1) + 1) % 1;
      const p = document.getElementById(pathId);
      const len = p.getTotalLength();
      const pt = p.getPointAtLength(u * len);
      const env = Math.sin(Math.PI * u);
      const el = document.getElementById(pktId);
      el.setAttribute("cx", pt.x.toFixed(1));
      el.setAttribute("cy", pt.y.toFixed(1));
      el.setAttribute("r", (2.2 + 3.4 * env).toFixed(2));
      el.setAttribute("opacity", env.toFixed(3));
    }

    function setNodeHighlight(id, active, colorVar) {
      const rect = document.querySelector("#" + id + " rect");
      rect.setAttribute("stroke", active ? "var(" + colorVar + ")" : "var(--loop-line)");
      rect.setAttribute("stroke-width", active ? "2.6" : "1.6");
    }

    window.renderLoop = function(phase, kit, meta) {
      const S = window.__LOOP_SHOWCASE__ || {};
      const seconds = S.seconds || (meta && meta.seconds) || 8;
      const steps = Array.isArray(S.steps) ? S.steps : [];
      const t = phase * seconds;
      const TAU = Math.PI * 2;

      let activeIdx = 0;
      let activeCaption = steps[0] ? steps[0].caption : "";
      steps.forEach((st, idx) => {
        const len = ((st.to - st.from) % seconds + seconds) % seconds || seconds;
        const u = ((t - st.from) % seconds + seconds) % seconds;
        if (u < len) {
          activeIdx = idx;
          activeCaption = st.caption;
        }
      });

      document.getElementById("caption-text").textContent = activeCaption;

      for (let i = 0; i < 4; i++) {
        document.getElementById("st-" + i).classList.toggle("active", i === activeIdx);
      }

      setNodeHighlight("node-0", activeIdx === 0, "--loop-accent");
      setNodeHighlight("node-1", activeIdx === 1, "--loop-spark");
      setNodeHighlight("node-2a", activeIdx === 2, "--loop-spark");
      setNodeHighlight("node-2b", activeIdx === 2, "--loop-accent");
      setNodeHighlight("node-3", activeIdx === 3, "--loop-spark");

      const ang = phase * TAU - Math.PI / 2;
      const dot = document.getElementById("ring-dot");
      dot.setAttribute("cx", (10 + Math.cos(ang) * 7).toFixed(2));
      dot.setAttribute("cy", (10 + Math.sin(ang) * 7).toFixed(2));

      // Continuous integer-cycle signal flow along all 5 SVG bezier paths
      placeOnPath("p0", "pkt0", phase * 2);
      placeOnPath("p1", "pkt1", phase * 2 + 0.35);
      placeOnPath("p2", "pkt2", phase * 2 + 0.55);
      placeOnPath("p3", "pkt3", phase * 2 + 0.72);
      placeOnPath("p4", "pkt4", phase * 2 + 0.85);

      const pulse = 0.25 + 0.55 * (0.5 + 0.5 * Math.sin(TAU * phase * 2));
      document.getElementById("g0").setAttribute("opacity", (activeIdx === 0 ? 0.92 : pulse * 0.45).toFixed(2));
      document.getElementById("g1").setAttribute("opacity", (activeIdx === 1 || activeIdx === 2 ? 0.92 : pulse * 0.45).toFixed(2));
      document.getElementById("g2").setAttribute("opacity", (activeIdx === 1 || activeIdx === 2 ? 0.92 : pulse * 0.45).toFixed(2));
      document.getElementById("g3").setAttribute("opacity", (activeIdx === 3 ? 0.95 : pulse * 0.45).toFixed(2));
      document.getElementById("g4").setAttribute("opacity", (activeIdx === 3 ? 0.95 : pulse * 0.45).toFixed(2));
    };
  </script>
</body>
</html>
