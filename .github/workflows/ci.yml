name: Loop Studio CI & Evals

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install FFmpeg for external video audit tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Check Loop CLI Doctor
        run: node ./tool/bin/loop.js doctor
      - name: Run Core, Chromium & External Video Eval Suite
        run: npm test
