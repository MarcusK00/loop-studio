name: Loop Studio CI & Evals

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check Loop CLI Doctor
        run: node ./tool/bin/loop.js doctor
      - name: Run Core & Browser Eval Suite
        run: npm test
