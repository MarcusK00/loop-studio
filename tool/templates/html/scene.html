<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background:
        radial-gradient(540px 280px at 50% 24%, color-mix(in srgb, var(--loop-spark) 14%, transparent), transparent 72%),
        var(--loop-ground);
      color: var(--loop-body);
      font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 28px;
      overflow: hidden;
    }

    .topbar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phase-ring {
      width: 16px;
      height: 16px;
      flex: none;
    }

    .title {
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .stages {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 999px;
      border: 1px solid var(--loop-line);
      background: var(--loop-surface);
      color: var(--loop-body);
      opacity: 0.72;
    }

    .pill.active {
      opacity: 1;
      border-color: var(--loop-accent);
      background: var(--loop-accent);
      color: var(--loop-on-accent);
    }

    .stage-card {
      width: 100%;
      flex: 1;
      margin: 14px 0;
      background: var(--loop-surface);
      border: 1px solid var(--loop-line);
      border-radius: 14px;
      padding: 20px 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      align-items: center;
      position: relative;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.18);
    }

    .node {
      background: var(--loop-ground);
      border: 1px solid var(--loop-line);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .node.active {
      border-color: var(--loop-spark);
      box-shadow: 0 0 0 1px color-mix(in srgb, var(--loop-spark) 40%, transparent);
    }

    .node-kicker {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      color: var(--loop-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .node-title {
      font-size: 15px;
      font-weight: 700;
    }

    .node-bar {
      height: 6px;
      border-radius: 999px;
      background: var(--loop-line);
      overflow: hidden;
    }

    .node-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--loop-accent), var(--loop-spark));
      width: 30%;
    }

    .caption-pill {
      background: var(--loop-surface);
      border: 1px solid var(--loop-line);
      border-radius: 10px;
      padding: 7px 18px;
    }

    .caption-text {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--loop-body);
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">
      <svg class="phase-ring" viewBox="0 0 20 20">
        <circle cx="10" cy="10" r="7" fill="none" stroke="var(--loop-line)" stroke-width="2.2" />
        <circle id="ring-dot" cx="10" cy="3" r="2.8" fill="var(--loop-accent)" />
      </svg>
      <span class="title">Repository Pipeline</span>
    </div>
    <div class="stages">
      <span class="pill" id="st-0" data-loop-stage>Input</span>
      <span class="pill" id="st-1" data-loop-stage>Transform</span>
      <span class="pill" id="st-2" data-loop-stage>Output</span>
    </div>
  </div>

  <div class="stage-card">
    <div class="node" id="n-0">
      <div class="node-kicker">01 · Ingest</div>
      <div class="node-title">Source Files</div>
      <div class="node-bar"><div class="node-fill" id="f-0"></div></div>
    </div>
    <div class="node" id="n-1">
      <div class="node-kicker">02 · Process</div>
      <div class="node-title">Core Engine</div>
      <div class="node-bar"><div class="node-fill" id="f-1"></div></div>
    </div>
    <div class="node" id="n-2">
      <div class="node-kicker">03 · Verify</div>
      <div class="node-title">Clean Output</div>
      <div class="node-bar"><div class="node-fill" id="f-2"></div></div>
    </div>
  </div>

  <div class="caption-pill">
    <span class="caption-text" id="caption-text" data-loop-caption>reads input specification</span>
  </div>

  <script>
    window.renderLoop = function(phase, kit, meta) {
      const S = window.__LOOP_SHOWCASE__ || {};
      const seconds = S.seconds || (meta && meta.seconds) || 9;
      const steps = Array.isArray(S.steps) ? S.steps : [];
      const t = phase * seconds;
      const TAU = Math.PI * 2;

      let activeIdx = 0;
      let activeCaption = "reads input specification";
      steps.forEach((st, idx) => {
        const len = ((st.to - st.from) % seconds + seconds) % seconds || seconds;
        const u = ((t - st.from) % seconds + seconds) % seconds;
        if (u < len) {
          activeIdx = idx;
          activeCaption = st.caption;
        }
      });

      document.getElementById("caption-text").textContent = activeCaption;

      const ang = phase * TAU - Math.PI / 2;
      const ringDot = document.getElementById("ring-dot");
      ringDot.setAttribute("cx", (10 + Math.cos(ang) * 7).toFixed(2));
      ringDot.setAttribute("cy", (10 + Math.sin(ang) * 7).toFixed(2));

      for (let i = 0; i < 3; i++) {
        const on = i === activeIdx;
        document.getElementById("st-" + i).classList.toggle("active", on);
        document.getElementById("n-" + i).classList.toggle("active", on);
        const wave = 0.5 + 0.5 * Math.sin(TAU * phase - i * 2.1);
        const pct = on ? 56 + 38 * wave : 22 + 34 * wave;
        document.getElementById("f-" + i).style.width = pct.toFixed(1) + "%";
      }
    };
  </script>
</body>
</html>
